<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Life</title>
    <meta
      name="description"
      content="An interactive Conway's Game of Life cellular automaton simulator."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Game of Life</h1>
    </header>

    <main class="app-main">
      <div class="toolbar" id="toolbar">
        <button id="playPause" class="btn btn-primary" type="button">
          ▶ Play
        </button>
        <button id="backBtn" class="btn" type="button">⟲ Back</button>
        <button id="stepBtn" class="btn" type="button">Step</button>
        <button id="randomBtn" class="btn" type="button">🎲 Random</button>
        <button id="clearBtn" class="btn" type="button">🗑 Clear</button>

        <label class="field">
          Speed
          <input
            id="speed"
            type="range"
            min="1"
            max="60"
            value="10"
            step="1"
          />
        </label>

        <label class="field">
          Theme
          <select id="theme" class="select">
            <option value="midnight">Midnight</option>
            <option value="light">Light</option>
            <option value="neon">Neon</option>
            <option value="retro">Retro</option>
          </select>
        </label>

        <label class="field">
          <input id="ageColor" type="checkbox" checked />
          Colour by age
        </label>

        <label class="field">
          <input id="showGrid" type="checkbox" checked />
          Grid lines
        </label>

        <label class="field">
          Brush
          <input id="brush" type="range" min="1" max="10" value="1" step="1" />
        </label>

        <label class="field">
          Density
          <input
            id="density"
            type="range"
            min="5"
            max="90"
            value="30"
            step="5"
          />
        </label>

        <label class="field">
          Pattern
          <select id="pattern" class="select"></select>
        </label>
        <button id="placeBtn" class="btn" type="button">Place</button>
        <label class="field">
          <input id="placeMode" type="checkbox" />
          Click to place
        </label>
      </div>

      <div class="toolbar" id="ruleBar">
        <label class="field">
          Rule
          <select id="rulePreset" class="select"></select>
        </label>
        <label class="field">
          Custom (B/S)
          <input id="customRule" class="text-input" type="text" value="B3/S23" />
        </label>
        <button id="applyRule" class="btn" type="button">Apply</button>

        <label class="field">
          <input id="wrap" type="checkbox" />
          Wrap edges
        </label>

        <button id="saveBtn" class="btn" type="button">💾 Save</button>
        <button id="loadBtn" class="btn" type="button">📂 Load</button>
      </div>

      <canvas id="board" class="board" width="800" height="600"></canvas>

      <div class="statusbar" id="statusbar">
        <span>Generation: <strong id="genCount">0</strong></span>
        <span>Alive: <strong id="popCount">0</strong></span>
        <span>FPS: <strong id="fpsCount">0</strong></span>
        <span>Cursor: <strong id="cursorCell">—</strong></span>
      </div>
    </main>

    <script src="js/grid.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/patterns.js"></script>
    <script src="js/automata.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
    <script src="js/input.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/keyboard.js"></script>
  </body>
</html>
