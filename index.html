<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Life</title>
    <meta
      name="description"
      content="An interactive Conway's Game of Life cellular automaton simulator."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Game of Life</h1>
    </header>

    <main class="app-main">
      <div class="toolbar" id="toolbar">
        <button id="playPause" class="btn btn-primary" type="button">
          ▶ Play
        </button>
        <button id="stepBtn" class="btn" type="button">Step</button>
        <button id="randomBtn" class="btn" type="button">🎲 Random</button>
        <button id="clearBtn" class="btn" type="button">🗑 Clear</button>

        <label class="field">
          Speed
          <input
            id="speed"
            type="range"
            min="1"
            max="60"
            value="10"
            step="1"
          />
        </label>
      </div>

      <canvas id="board" class="board" width="800" height="600"></canvas>
    </main>

    <script src="js/grid.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
    <script src="js/input.js"></script>
    <script src="js/controls.js"></script>
  </body>
</html>
